name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  # Validate the installer script and packaging generator on every change so
  # release automation can't silently rot.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck install + packaging scripts
        run: shellcheck install.sh scripts/*.sh

      - name: Smoke-test packaging generator
        run: |
          printf '%s  bsv-v9.9.9-x86_64-pc-windows-msvc.zip\n' "$(printf '%064d' 0)" \
            > /tmp/SHA256SUMS
          scripts/update-packaging.sh 9.9.9 /tmp/SHA256SUMS
          grep -q '"version": "9.9.9"' bucket/bsv.json
          python3 -m json.tool bucket/bsv.json > /dev/null
          # Restore the working tree so the smoke test leaves no diff.
          git checkout -- bucket/bsv.json
