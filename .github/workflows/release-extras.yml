# Scoop manifest refresh, run after the release-kit v2 `release` workflow
# succeeds for a tag. The old release.yml regenerated bucket/bsv.json next to
# the Homebrew formula; the formula is now the kit's job, and this keeps the
# Scoop half, fed by the release's published SHA256SUMS.
#
# Only tag-push runs qualify: a manually dispatched release run's head_branch is
# the default branch, not the tag, so dispatched re-runs skip the extras.
name: release-extras

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

env:
  TAG: ${{ github.event.workflow_run.head_branch }}

jobs:
  scoop:
    name: update scoop manifest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Regenerate bucket/bsv.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          scripts/update-packaging.sh "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS"

      # Same route as release.yml's formula PR: the default branch only accepts
      # changes through a pull request.
      - name: Open and merge Scoop PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bucket/bsv.json; then
            echo "No packaging changes to commit."
            exit 0
          fi
          branch="release/${TAG}-scoop"
          title="chore(release): update Scoop manifest for ${TAG}"
          git checkout -b "$branch"
          git add bucket/bsv.json
          git commit -m "$title"
          git push --force origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base "$BASE" --head "$branch" --title "$title" \
                   --body "Generated by release-extras from the published ${TAG} SHA256SUMS." \
                 | awk -F/ '{print $NF}')
          fi
          if ! gh pr merge "$pr" --squash --delete-branch; then
            state=$(gh pr view "$pr" --json state -q .state)
            if [ "$state" != "MERGED" ]; then
              echo "::error::Scoop PR #${pr} could not be merged (state=${state})"
              exit 1
            fi
          fi
